<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: only Clockify's API can be contacted; no outside scripts, fonts or images can load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.clockify.me; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A21" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Chronologic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18202B; --muted:#5D6878; --line:#D7DDE4;
  --go:#0E6B64; --go-ink:#FFFFFF; --run:#B45309; --run-bg:#FFF4E5; --danger:#B42318;
  --radius-lg:14px; --radius-sm:8px;
  --digits: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151A21; --surface:#1E252E; --ink:#E7ECF2; --muted:#97A3B3; --line:#2C3541;
    --go:#3FB8AC; --go-ink:#0C1A19; --run:#F0A845; --run-bg:#2A2216; --danger:#F97066; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Running bar: the one bold element */
.now{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.now-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-left:6px solid var(--line);border-radius:var(--radius-lg);padding:12px 12px 12px 16px}
.now-card.running{background:var(--run-bg);border-color:transparent}
.now-info{flex:1;min-width:0}
.now-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.digits{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:34px;font-weight:300;letter-spacing:.5px;line-height:1.1}
.running .digits{color:var(--run)}
.stop{border:0;border-radius:999px;background:var(--run);color:var(--run-bg);font-weight:600;padding:12px 20px;cursor:pointer}
.stop:disabled{opacity:.5}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}

.searchbar{display:flex;gap:8px;margin-top:10px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;outline:none;min-width:0}
.search:focus{border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.search:focus-visible{outline:none}
@media (max-width:420px){.digits{font-size:28px}.stop{padding:11px 16px}}

h2{font-size:14px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}

.group{margin-top:8px}
.group-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.project + .project{border-top:1px solid var(--line)}

.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;cursor:pointer;text-align:left;min-height:50px}
.row:hover,.row.active{background:color-mix(in srgb, var(--go) 9%, transparent)}
.row .label{flex:1;min-width:0}
.row .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.project-row .title{font-weight:600}
.tasks{margin-left:20px;border-left:2px solid var(--pc,var(--line))}
.tasks .row{padding-left:16px;min-height:44px}
.play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--go);color:var(--go-ink)}
.row.is-running .play{background:var(--run);color:var(--run-bg)}
.row.is-running .meta.state{color:var(--run)}
.results{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-top:14px}
.results .row + .row{border-top:1px solid var(--line)}

.empty{color:var(--muted);text-align:center;padding:36px 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-top:14px}
.panel h3{margin:0 0 4px;font-size:18px}
.panel p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--go);color:var(--go-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.error{background:var(--danger);color:#fff}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.project-line{display:flex;align-items:stretch}
.project-line .row{flex:1;min-width:0;padding-left:4px}
.chev{flex:none;width:44px;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.chev:hover{color:var(--ink)}
.chev svg{transition:transform .15s}
.project.collapsed .chev svg{transform:rotate(-90deg)}
.project.collapsed .tasks{display:none}
.tasks{margin-left:36px}
.row.add{color:var(--go);min-height:42px}
.row.add .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px dashed var(--go);font-size:18px;line-height:1}
.results .row.add{border-top:1px solid var(--line)}
.list-tools{display:flex;justify-content:flex-end;gap:4px;margin-top:14px}
.link{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 8px;cursor:pointer;border-radius:var(--radius-sm)}
.link:hover{color:var(--ink)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;cursor:pointer;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--go)}
.searchbar .seg{margin-top:0;flex:1}
.sum-head{display:flex;align-items:center;gap:8px;margin-top:14px}
.sum-title{flex:1;text-align:center;font-weight:600}
.sum-sub{text-align:center;color:var(--muted);font-size:13px}
.nav{width:36px;height:36px}
.nav:disabled{opacity:.35;cursor:default}
.custom-dates{display:flex;gap:8px;margin-top:10px;align-items:center}
.custom-dates input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-top:12px}
.card h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px;margin-bottom:6px}
.crumbs .link{padding:4px 6px}
.crumbs .here{font-weight:600;padding:4px 6px}
.donut-wrap{display:flex;justify-content:center;margin:4px 0 6px}
.slice{cursor:pointer;transition:opacity .15s}
.slice:hover{opacity:.8}
.bars{display:flex;flex-direction:column;margin-top:6px}
.bar{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 4px;color:inherit}
button.bar{cursor:pointer}
button.bar:hover{background:color-mix(in srgb, var(--go) 7%, transparent)}
.bar-top{display:flex;align-items:center;gap:8px}
.bar-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-time{font-variant-numeric:tabular-nums;font-weight:600}
.bar-more{color:var(--muted);width:12px;text-align:center}
.bar-bottom{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.track{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.fill{height:100%;border-radius:4px;min-width:2px}
.pct{width:38px;text-align:right;font-variant-numeric:tabular-nums}
.delta{width:84px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;display:block;overflow:visible}
.chart text{font:11px var(--text);fill:var(--muted)}
.chart .today-lbl{fill:var(--ink);font-weight:600}
.hit{cursor:pointer;fill:transparent}
.hit:hover,.hit.sel{fill:color-mix(in srgb, var(--ink) 7%, transparent)}
.seg-rect{cursor:pointer}
.detail{font-size:14px;margin-top:10px;min-height:20px}
.detail .muted{color:var(--muted)}
.detail-list{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
.detail-list span{display:inline-flex;align-items:center;gap:6px}
.detail-list .dot{width:8px;height:8px}
.today{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-top:14px;cursor:pointer;color:inherit}
.today:hover{border-color:color-mix(in srgb, var(--go) 45%, var(--line))}
.today-top{display:flex;align-items:baseline;gap:10px}
.today-label{font-size:14px;font-weight:600;color:var(--muted)}
.today-total{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;margin-left:auto}
.today-delta{font-size:13px;color:var(--muted);white-space:nowrap}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);margin-top:10px;gap:2px}
.stack span{height:100%;min-width:3px}
.today-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.today-legend span{display:inline-flex;align-items:center;gap:6px}
.today-legend .dot{width:8px;height:8px}
.today-legend b{color:var(--ink);font-weight:600}
.rtime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.is-running .rtime{color:var(--run);font-weight:600}
/* Quick start tiles: pinned favorites, then recent items */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px}
.sec-head h2{margin:0}
.hint{color:var(--muted);font-size:14px;margin:0 4px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{--pc:var(--muted);position:relative;display:flex;flex-direction:column;gap:2px;min-height:84px;padding:10px 10px 10px 14px;text-align:left;cursor:pointer;
  border:1px solid color-mix(in srgb, var(--pc) 30%, var(--line));border-radius:var(--radius-lg);
  background:color-mix(in srgb, var(--pc) 12%, var(--surface));box-shadow:inset 4px 0 0 var(--pc)}
.tile:hover{border-color:color-mix(in srgb, var(--pc) 60%, var(--line))}
.tile:active{transform:scale(.98)}
.tile-name{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-foot{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:18px}
.tile .rtime{flex:1}
.tile-pin{color:var(--muted);font-size:12px}
.tile.is-running{background:var(--run-bg);border-color:var(--run);box-shadow:inset 4px 0 0 var(--run)}
.tile.is-running .rtime,.tile-state{color:var(--run);font-weight:600;font-size:12px}
.tile.ghost{border-style:dashed;background:var(--surface)}
.tile-badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:15px;line-height:1}
.tile.ghost .tile-badge{background:var(--go);color:var(--go-ink)}
.tiles.editing .tile-name{padding-right:20px}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Category tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding:2px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab .dot{width:8px;height:8px}
.tab .rtime:empty{display:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .rtime{color:inherit}
.star{background:none;border:1.5px solid var(--go);color:var(--go)}
.row.pinned .star{background:var(--go);color:var(--go-ink)}
/* Bottom navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 4px 10px;cursor:pointer;color:var(--muted);font-size:12px}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-current="page"]{color:var(--go);font-weight:600}
.task-focus{text-align:center;padding:10px 0 4px}
.task-name{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px;max-width:100%}
.task-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-total{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:40px;font-weight:600;line-height:1.1;margin-top:10px}
.task-delta{margin-top:8px}
/* Plan view: planned blocks next to tracked time */
.plan-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.plan-actions .btn{padding:7px 12px;font-size:14px}
.plan-hint{text-align:center;margin:12px 4px 0}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px 12px;min-width:0}
.score-label{font-size:12px;color:var(--muted);font-weight:600}
.score-val{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;line-height:1.2}
.score-sub{font-size:12px;color:var(--muted)}
.plan-counts{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:12px;overflow:hidden}
.cal-grid{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,.6fr);column-gap:6px;padding-right:8px}
.cal-head{font-size:12px;font-weight:600;color:var(--muted);padding:10px 2px 8px}
.cal-scroll{max-height:min(66vh,1560px);overflow-y:auto;border-top:1px solid var(--line)}
.cal-scroll .cal-grid{padding-top:10px;padding-bottom:10px}
.cal-times{position:relative}
.cal-times span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.lane{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-size:100% 64px,100% 32px}
.plan-lane{cursor:cell}
.pb{--pc:var(--muted);position:absolute;left:2px;right:2px;display:flex;flex-direction:column;gap:1px;padding:3px 6px 3px 9px;overflow:hidden;text-align:left;font-size:12px;line-height:1.25;color:var(--ink);
  border:1px solid color-mix(in srgb,var(--pc) 45%,var(--line));border-radius:6px;background:color-mix(in srgb,var(--pc) 16%,var(--surface));box-shadow:inset 3px 0 0 var(--pc);cursor:pointer}
.pb:hover{border-color:var(--pc)}
.pb-top{display:flex;gap:6px;align-items:center;min-width:0}
.pb-name{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-meta{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pb.short{justify-content:center;padding-top:0;padding-bottom:0}
.pb.short .pb-meta{display:none}
.pb-mark{flex:none;font-weight:700}
.st-done .pb-mark{color:var(--go)}
.st-miss .pb-mark{color:var(--danger)}
.st-part .pb-mark,.st-now .pb-mark{color:var(--run)}
.pb.st-miss{background:color-mix(in srgb,var(--pc) 6%,var(--surface));border-style:dashed}
.pb-grip{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.pb.ghost{border:1.5px dashed var(--go);background:color-mix(in srgb,var(--go) 10%,transparent);box-shadow:none;color:var(--go);font-weight:600;pointer-events:none}
.pb.dragging{z-index:2;box-shadow:inset 3px 0 0 var(--pc),0 4px 12px rgb(0 0 0 / .18)}
.ab{--pc:var(--muted);position:absolute;left:0;right:0;border-radius:4px;background:var(--pc);overflow:hidden;cursor:pointer}
.ab.close{background:repeating-linear-gradient(135deg,var(--pc) 0 5px,color-mix(in srgb,var(--pc) 40%,var(--surface)) 5px 10px)}
.ab.off{background:color-mix(in srgb,var(--pc) 30%,var(--surface));outline:1px dashed color-mix(in srgb,var(--pc) 70%,var(--line));outline-offset:-1px}
.ab-name{display:block;padding:2px 5px;font-size:11px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgb(0 0 0 / .4)}
.ab.off .ab-name,.ab.close .ab-name{color:var(--ink);text-shadow:none}
.now-line{position:absolute;left:-3px;right:0;height:2px;background:var(--run);z-index:3;pointer-events:none}
.cal-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.cal-key i{--pc:var(--muted);display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;position:static}
.pt-head,.pt-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 62px 62px;gap:8px;align-items:center}
.pt-head{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px 6px}
.pt-head span:not(:first-child),.pt-num{text-align:right}
.pt-row{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 4px;text-align:left;color:inherit;font-variant-numeric:tabular-nums}
button.pt-row{cursor:pointer}
button.pt-row:hover{background:color-mix(in srgb,var(--go) 7%,transparent)}
.pt-name{display:flex;align-items:center;gap:8px;min-width:0}
.pt-name .label{min-width:0}
.pt-name .title,.pt-name .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-name .meta{font-size:12px;color:var(--muted)}
.pt-num{font-size:14px}
.pt-diff.over{color:var(--go)}
.pt-diff.under{color:var(--danger)}
.plan-now{--pc:var(--go);display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 12px 12px 16px;border:1px solid color-mix(in srgb,var(--pc) 35%,var(--line));border-radius:var(--radius-lg);
  background:color-mix(in srgb,var(--pc) 12%,var(--surface));box-shadow:inset 4px 0 0 var(--pc)}
.plan-now-info{flex:1;min-width:0}

<body>
<div class="wrap">

    <button class="nav-btn" type="button" id="navSummary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Summary</span></button>

  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const BASE = 'https://api.clockify.me/api/v1';
const K = { key:'qt.key', cache:'qt.cache', recent:'qt.recent', fav:'qt.fav', tab:'qt.tab', ws:'qt.ws', projOpen:'qt.projOpen', sumKind:'qt.sumKind', calls:'qt.calls', backoff:'qt.backoff',
  plan:'qt.plan', planTpl:'qt.planTpl', actual:'qt.actual', counters:'qt.counters', counts:'qt.counts', countRange:'qt.countRange' };
const DAY = 86400000;

// ---------- storage (always guarded) ----------
const store = {
  get(k, fallback){ try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

// ---------- state ----------
let apiKey = store.get(K.key, '');
let cache = store.get(K.cache, null);        // {ws, userId, workspaces, projects, at}
let recent = store.get(K.recent, []);         // [{p, t}]
let fav = store.get(K.fav, []);               // pinned Quick start items [{p, t}]
let tab = store.get(K.tab, null);             // selected category tab: client name, '' for none, null for All
let editFav = false, tabsScroll = 0;
let projOpen = store.get(K.projOpen, {});     // {projectId: true|false}; default open when it has tasks
let running = null;                           // {id, projectId, taskId, start, pName, tName, color}
let calls = store.get(K.calls, []), backoffUntil = store.get(K.backoff, 0);
let lastSync = 0, lastSyncTry = 0, syncing = false;
let busy = false, query = '', activeIdx = 0, resultItems = [];
let projectsById = new Map();

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;   // never innerHTML with data
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const byName = (a, b) => a.name.localeCompare(b.name);
const safeColor = c => (typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c)) ? c : null;
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
function fmt(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
let toastTimer;
function toast(msg, isError){
  const t = $('toast'); t.textContent = msg; t.classList.toggle('error', !!isError); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 5000 : 2200);
}
function playIcon(){
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width','12'); s.setAttribute('height','12'); s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d','M3 1.5v9l7.5-4.5z'); p.setAttribute('fill','currentColor'); s.append(p);
  return el('span', {class:'play'}, s);
}
function starIcon(){
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width','14'); s.setAttribute('height','14'); s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d','M6 1l1.55 3.14 3.45.5-2.5 2.44.59 3.44L6 8.9 2.91 10.52l.59-3.44L1 4.64l3.45-.5z'); p.setAttribute('fill','currentColor'); s.append(p);
  return el('span', {class:'play star'}, s);
}

// ---------- API ----------
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }
function noteCall(){
  const now = Date.now();
  calls = calls.filter(t => now - t < 3600000); calls.push(now); store.set(K.calls, calls);
  if (!$('settings').classList.contains('hidden')) showUsage();
}
function callsLastHour(){ const now = Date.now(); return calls.filter(t => now - t < 3600000).length; }
function showUsage(){
  const n = callsLastHour();
  let txt = `This device made ${n} request${n === 1 ? '' : 's'} to Clockify in the last hour. Free workspaces allow 30 per hour, shared across all your devices.`;
  if (Date.now() < backoffUntil) txt += ` Auto-refresh is paused until ${fmtClock(backoffUntil)} because Clockify reported the limit.`;
  $('usage').textContent = txt;
}
const fmtClock = ms => new Date(ms).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
async function api(path, method = 'GET', body){
  let res;
  noteCall();
  try {
    res = await fetch(BASE + path, {
      method, cache:'no-store', referrerPolicy:'no-referrer',
      headers: { 'X-Api-Key': apiKey, ...(body ? {'Content-Type':'application/json'} : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch {
    throw new ApiError(0, "Couldn't reach Clockify. Check your internet connection.");
  }
  if (res.status === 401) throw new ApiError(401, "Clockify didn't accept the API key. Paste a current key in Settings.");
  if (res.status === 403) { let m = ''; try { m = (await res.json()).message || ''; } catch {} throw new ApiError(403, m || "Your Clockify role doesn't allow this action in this workspace."); }
  if (res.status === 429) {
    backoffUntil = Date.now() + 10 * 60000; store.set(K.backoff, backoffUntil);
    throw new ApiError(429, `Clockify's hourly request limit was reached. Auto-refresh is paused until ${fmtClock(backoffUntil)}.`);
  }
  if (!res.ok) { let m = ''; try { m = (await res.json()).message || ''; } catch {} throw new ApiError(res.status, m || `Clockify returned an error (${res.status}).`); }
  if (res.status === 204) return null;
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
async function getAll(path){
  const out = []; const size = 500;
  for (let page = 1; page < 50; page++) {
    const sep = path.includes('?') ? '&' : '?';
    const batch = await api(`${path}${sep}page=${page}&page-size=${size}`);
    out.push(...batch); if (batch.length < size) break;
  }
  return out;
}

// ---------- data ----------
function indexCache(){
  projectsById = new Map();
  if (cache) for (const p of cache.projects) projectsById.set(p.id, p);
}
async function refreshData(announce){
  const user = await api('/user');
  const workspaces = (await api('/workspaces')).map(w => ({ id:w.id, name:w.name }));
  const chosen = store.get(K.ws, '');
  const ws = workspaces.some(w => w.id === chosen) ? chosen : (user.activeWorkspace || user.defaultWorkspace || workspaces[0]?.id);
  const clients = await getAll(`/workspaces/${ws}/clients?archived=false`);
  const clientName = new Map(clients.map(c => [c.id, c.name]));
  const rawProjects = await getAll(`/workspaces/${ws}/projects?archived=false&hydrated=true`);
  const projects = rawProjects.map(p => ({
    id: p.id, name: p.name, color: safeColor(p.color),
    client: (p.clientId && clientName.get(p.clientId)) || p.clientName || '', clientId: p.clientId || null,
    tasks: (p.tasks || []).filter(t => t.status !== 'DONE').map(t => ({ id:t.id, name:t.name }))
      .sort((a,b) => a.name.localeCompare(b.name))
  })).sort((a,b) => a.name.localeCompare(b.name));
  cache = { ws, userId: user.id, weekStart: user.settings?.weekStart || 'MONDAY', workspaces, projects, clients: clients.map(c => ({ id:c.id, name:c.name })).sort(byName), at: Date.now() };
  store.set(K.cache, cache); indexCache();
  if (announce) toast(`Loaded ${projects.length} projects`);
}
// One request refreshes both today's entries and the running timer.
// mode 'user': always; 'auto': skip if refreshed in the last 3 minutes or paused; 'missing': at most once a minute.
async function sync(mode = 'auto'){
  if (!cache || !apiKey || syncing) return;
  const now = Date.now();
  if (mode !== 'user') {
    if (now < backoffUntil) return;
    if (mode === 'auto' && now - lastSync < 180000) return;
    if (mode === 'missing' && now - lastSyncTry < 60000) return;
  }
  syncing = true; lastSyncTry = now;
  const p = period('today', 0);
  try { sumCache.delete(todayKey(p)); await fetchSegs(p, countsGapFrom(p)); }
  catch (err) { if (mode === 'user' || err.status === 401 || err.status === 429) handleError(err); }
  finally { syncing = false; renderAll(); }
}
function toRunning(e){
  const p = projectsById.get(e.projectId);
  const t = p?.tasks.find(x => x.id === e.taskId);
  return { id:e.id, projectId:e.projectId || null, taskId:e.taskId || null,
    start: Date.parse(e.timeInterval.start),
    pName: p?.name || e.project?.name || 'No project',
    tName: t?.name || e.task?.name || '',
    color: p?.color || safeColor(e.project?.color) };
}

// ---------- actions ----------
async function stopRemote(end, quiet){
  try { return await api(`/workspaces/${cache.ws}/user/${cache.userId}/time-entries`, 'PATCH', { end }); }
  catch (err) { if (quiet && (err.status === 400 || err.status === 404)) return null; throw err; }
}
async function start(p, t){
  if (busy || !cache) return;
  if (running && running.projectId === p.id && (running.taskId || null) === (t?.id || null)) { toast('Already running'); return; }
  busy = true; document.body.style.cursor = 'progress';
  const now = isoNow(), prev = running;
  const body = { start: now, projectId: p.id, billable: false };
  if (t) body.taskId = t.id;
  const post = () => api(`/workspaces/${cache.ws}/time-entries`, 'POST', body);
  try {
    let e;
    if (prev) {                        // known running timer: stop it, then start (2 requests)
      recordStopped(await stopRemote(now, true), prev, now);
      e = await post();
    } else {                           // looks idle: try starting directly (1 request)
      try { e = await post(); }
      catch (err) {                    // a timer started on another device may be in the way
        if (err.status !== 400 && err.status !== 409) throw err;
        recordStopped(await stopRemote(now, true), null, now);
        e = await post();
      }
    }
    running = toRunning(e);
    recent = [{ p:p.id, t:t?.id || null }, ...recent.filter(r => !(r.p === p.id && r.t === (t?.id || null)))].slice(0, 8);
    store.set(K.recent, recent);
    toast(`Started ${t ? t.name : p.name}`);
    query = ''; $('search').value = ''; $('search').blur();
  } catch (err) { handleError(err); }
  finally { busy = false; document.body.style.cursor = ''; renderAll(); }
}
async function stop(){
  if (busy || !running) return;
  busy = true; $('stopBtn').disabled = true;
  const r = running, now = isoNow();
  try {
    const e = await stopRemote(now, false);
    recordStopped(e, r, now);
    toast(`Stopped at ${fmt(Date.now() - r.start)}`); running = null;
  } catch (err) {
    if (err.status === 400 || err.status === 404) { running = null; toast('That timer was already stopped'); sync('user'); }
    else handleError(err);
  }
  finally { busy = false; $('stopBtn').disabled = false; renderAll(); }
}
// Add a just-finished entry to the cached data locally instead of downloading the day again.
function recordStopped(entry, fallback, endIso){
  let seg = null;
  if (entry?.timeInterval?.end) seg = entryToSeg(entry, Date.now());
  else if (fallback) seg = { ...runningSeg(fallback), e: Date.parse(endIso), live:false };
  if (!seg || !(seg.e > seg.s)) return;
  for (const v of sumCache.values()) if (seg.e > v.from && !v.segs.some(g => g.id && g.id === seg.id)) v.segs.push(seg);

  finally { countsLoading = false; renderList(); if (view === 'summary' && sum.kind === 'counts') renderCounts(); }
}

// ----- counting -----
function counterEvents(c){
  const tn = t => counts.names[t] || [...projectsById.values()].flatMap(p => p.tasks).find(x => x.id === t)?.name || '';
  const hit = (p, t, name) => c.targets.some(tg => matchKind(tg, { p, t, tn: name }) === 'exact');
  const xs = counts.list.filter(x => hit(x[2], x[3], tn(x[3]))).map(x => ({ s: x[0] * 60000, e: x[1] * 60000 }));
  if (running && hit(running.projectId || 'none', running.taskId || 'none', running.tName) && !xs.some(x => Math.abs(x.s - running.start) < 60000))
    xs.push({ s: running.start, e: Date.now() });
  xs.sort((x, y) => x.s - y.s);
  const min = c.min * 60000, out = [];
  if (c.mode === 'days') {
    const per = new Map();
    for (const x of xs) { const d = ymd(new Date(x.s)); per.set(d, (per.get(d) || 0) + x.e - x.s); }
    for (const [d, ms] of per) if (ms >= Math.max(min, 1)) out.push(d);
  } else {
    let cur = null;
    const close = () => { if (cur && cur.e - cur.s >= Math.max(min, 1)) out.push(ymd(new Date(cur.s))); };
    for (const x of xs) { if (cur && x.s - cur.e <= MERGE_GAP * 60000) cur.e = Math.max(cur.e, x.e); else { close(); cur = { ...x }; } }
    close();
  }
  return out.sort();   // one day string per counted instance
}
function countRangeDays(k){
  const t = startOfDay(new Date());
  const a = k === 'week' ? addDays(t, -6) : k === 'year' ? new Date(t.getFullYear(), 0, 1) : addDays(monthsBack(t, { month:1, '3m':3, '6m':6, '9m':9, '12m':12 }[k]), 1);
  return { A: ymd(a), B: ymd(t) };
}
const coveredFrom = () => { const d = new Date(counts.a); return ymd(+d === +startOfDay(d) ? d : addDays(startOfDay(d), 1)); };
function countIn(c, ev, k){
  const { A, B } = countRangeDays(k), cov = coveredFrom();
  const base = c.base && c.base.through.slice(0, 4) === B.slice(0, 4) && c.base.through >= A ? c.base : null;
  if (k === 'year' && base) {
    const n = base.n + ev.filter(d => d > base.through && d <= B).length;
    return { n, partial: cov > ymd(addDays(parseYmd(base.through), 1)), base };
  }
  return { n: ev.filter(d => d >= A && d <= B).length, partial: A < cov };
}
const weekOf = d => { const x = parseYmd(d), ws = WD[cache?.weekStart] ?? 1; return ymd(addDays(x, -((x.getDay() - ws + 7) % 7))); };
const bucketOf = (per, d) => per === 'month' ? d.slice(0, 7) : weekOf(d);
const nextBucket = (per, b) => per === 'month' ? ymd(addMonths(parseYmd(b + '-01'), 1)).slice(0, 7) : ymd(addDays(parseYmd(b), 7));
// Streak: with a goal, consecutive weeks (or months) meeting it; without one, consecutive days.
function streakOf(c, ev){
  const today = ymd(new Date()), cov = coveredFrom();
  if (!c.goal) {
    const days = new Set(ev); let cur = 0, best = 0, run = 0, prev = null;
    for (let d = days.has(today) ? parseYmd(today) : addDays(parseYmd(today), -1); days.has(ymd(d)); d = addDays(d, -1)) cur++;
    for (const d of [...days].sort()) { run = prev && ymd(addDays(parseYmd(prev), 1)) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
    return { cur, best, unit:'day' };
  }
  const { kind, n, per } = c.goal, ok = v => kind === 'max' ? v <= n : v >= n;
  const by = new Map(); for (const d of ev) { const b = bucketOf(per, d); by.set(b, (by.get(b) || 0) + 1); }
  const now = bucketOf(per, today), seq = [];
  let b = bucketOf(per, cov); if (per === 'month' ? cov.slice(8) !== '01' : b !== cov) b = nextBucket(per, b);   // skip a partly covered first bucket
  for (; b <= now; b = nextBucket(per, b)) seq.push({ b, v: by.get(b) || 0 });
  let cur = 0, best = 0, run = 0;
  for (let i = seq.length - 1; i >= 0; i--) {
    if (ok(seq[i].v)) cur++;
    else if (i === seq.length - 1 && kind === 'min') continue;   // this week isn't over yet
    else break;
  }
  for (const [i, x] of seq.entries()) { if (ok(x.v)) { run++; best = Math.max(best, run); } else if (!(i === seq.length - 1 && kind === 'min')) run = 0; }
  return { cur, best, unit: per, thisPeriod: by.get(now) || 0 };
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function ruleText(c){
  const m = c.min ? dur(c.min * 60000) : '';
  const parts = [c.mode === 'days' ? (m ? `Days with ${m}+` : 'Days') : (m ? `Sessions of ${m}+` : 'Sessions')];
  if (c.goal) parts.push(c.goal.kind === 'max' ? `At most ${c.goal.n} a ${c.goal.per}` : `Goal ${c.goal.n}+ a ${c.goal.per}`);
  return parts.join(' · ');
}
function counterColor(c, i){ return (c.targets[0] && projectsById.get(c.targets[0].p)?.color) || PALETTE[i % PALETTE.length]; }
function goalText(c, st){
  if (!c.goal) return st.cur ? `Streak ${plural(st.cur, 'day')}` : '';
  const g = c.goal, v = st.thisPeriod;
  return `This ${g.per}: ${v} ${g.kind === 'max' ? `of max ${g.n}` : `of ${g.n}`}`;
}
const tileGoal = (c, st) => c.goal ? `${c.goal.per === 'month' ? 'Month' : 'Week'} ${st.thisPeriod}/${c.goal.kind === 'max' ? 'max ' : ''}${c.goal.n}` : st.cur ? `${st.cur}-day streak` : '';

// ----- Timer view tiles -----
function countersSection(list){
  if (!cache) return;
  seedCounters();
  const pins = (counters?.list || []).filter(c => c.pin);
  if (!pins.length) return;
  list.append(el('div', { class:'sec-head' }, el('h2', { text:'Counters' }),
    el('button', { class:'link', type:'button', text:'All counters', onclick: openCounts })));
  if (!counts?.full || counts.ws !== cache.ws) {
    setTimeout(() => ensureCounts(false), 0);
    list.append(el('p', { class:'hint', text: countsFailed ? "Couldn't load counter data. Open All counters to try again."
      : 'Setting up counters: downloading 12 months of entries once on this device (about 3 requests).' }));
    return;
  }
  list.append(el('div', { class:'tiles' }, pins.map(c => {
    const i = counters.list.indexOf(c), ev = counterEvents(c), y = countIn(c, ev, 'year'), st = streakOf(c, ev);
    const met = c.goal && (c.goal.kind === 'max' ? st.thisPeriod <= c.goal.n : st.thisPeriod >= c.goal.n);
    const t = el('button', { class:'tile ctile', type:'button', 'aria-label': `${c.name}: ${y.n} this year. ${goalText(c, st)}. Open counters`, onclick: openCounts },
      el('span', { class:'tile-name', text:c.name }),
      el('span', { class:'cnum' }, el('b', { text: String(y.n) }), el('span', { text:' this year' })),
      el('span', { class:`tile-sub${met ? ' met' : ''}`, text: tileGoal(c, st) }),
      c.goal && st.cur ? el('span', { class:'tile-sub', text:`${st.cur}-${st.unit} streak` }) : null);
    t.style.setProperty('--pc', counterColor(c, i));
    return t;
  })));
}
function openCounts(){ sum.kind = 'counts'; store.set(K.sumKind, 'counts'); setView('summary'); }

// ----- Summary > Counts -----
function renderCounts(){
  const box = $('summary');
  seedCounters();
  if (!counters) { box.replaceChildren(el('div', { class:'empty', text:'Load your projects first.' })); return; }
  const out = [];
  const seg = el('div', { class:'seg crange', role:'radiogroup', 'aria-label':'Count range' }, CRANGES.map(([k, short, long]) =>
    el('button', { type:'button', role:'radio', 'aria-checked': String(k === countRange), 'aria-label': long, text: short,
      onclick: () => { countRange = k; store.set(K.countRange, k); renderCounts(); } })));
  out.push(seg);
  const ready = counts?.full && counts.ws === cache.ws;
  if (!ready) {
    if (!countsLoading && !countsFailed) setTimeout(() => ensureCounts(false), 0);
    out.push(el('div', { class:'empty' }, el('div', { text: countsLoading ? 'Downloading 12 months of entries (about 3 requests, once per device)…'
        : countsFailed ? "Couldn't download your entries." : 'Getting ready…' }),
      countsFailed ? el('button', { class:'btn', type:'button', text:'Try again', style:'margin-top:12px', onclick: () => ensureCounts(true) }) : null));
    box.replaceChildren(...out); return;
  }
  const label = CRANGES.find(r => r[0] === countRange)[2], { A, B } = countRangeDays(countRange);
  out.push(el('div', { class:'sum-sub', style:'margin-top:10px', text: `${label}: ${fmtD(parseYmd(A), { month:'short', day:'numeric', year:'numeric' })} to today` }));
  counters.list.forEach((c, i) => out.push(counterCard(c, i, A, B)));
  out.push(el('div', { class:'btns', style:'margin-top:14px;justify-content:center' },
    el('button', { class:'btn primary', type:'button', text:'+ Add counter', onclick: () => counterDialog(null) })));
  out.push(el('p', { class:'hint', style:'margin-top:14px;text-align:center', text:
    `Counted from your Clockify entries since ${fmtD(new Date(counts.a), { month:'short', day:'numeric', year:'numeric' })}, kept up to date by normal syncing. "Partial" means the range starts before that. Sessions less than ${MERGE_GAP} minutes apart count as one.` }));
  out.push(el('div', { class:'btns', style:'justify-content:center' },
    el('button', { class:'btn', type:'button', text: countsLoading ? 'Recounting…' : 'Recount from Clockify (about 3 requests)', disabled: countsLoading ? '' : null,
      onclick: () => { if (confirm('Download 12 months of entries again? Use this after editing old entries on the Clockify website. About 3 requests.')) ensureCounts(true); } })));
  box.replaceChildren(...out);
}
function counterCard(c, i, A, B){
  const ev = counterEvents(c), r = countIn(c, ev, countRange), st = streakOf(c, ev), col = counterColor(c, i);
  const dot = el('span', { class:'dot' }); dot.style.background = col;
  const what = c.targets.map(t => targetOf(t).name).join(', ') || 'No tasks chosen yet. Tap Edit.';
  const notes = [];
  if (r.base) notes.push(`Includes ${r.base.n} counted before ${fmtD(addDays(parseYmd(r.base.through), 1))}`);
  if (c.goal) notes.push(goalText(c, st));
  if (st.cur || st.best) notes.push(`Streak ${plural(st.cur, st.unit)}${st.best > st.cur ? `, best ${st.best}` : ''}`);
  return el('div', { class:'card ccard' },
    el('div', { class:'ccard-top' }, dot,
      el('div', { class:'label' }, el('div', { class:'title', text:c.name }), el('div', { class:'meta', text:`${what} · ${ruleText(c)}` })),
      el('div', { class:'ccount' }, el('b', { text:String(r.n) }), r.partial ? el('span', { class:'partial', text:'partial' }) : null),
      el('button', { class:'link', type:'button', text:'Edit', 'aria-label':`Edit ${c.name}`, onclick: () => counterDialog(c) })),
    countBars(c, ev, A, B, col),
    notes.length ? el('div', { class:'sum-sub cnotes', text: notes.join(' · ') }) : null);
}
// Bars per day (7 days), per week (up to 3 months) or per month, with the goal line when it matches the bars.
function countBars(c, ev, A, B, col){
  const unit = countRange === 'week' ? 'day' : (countRange === 'month' || countRange === '3m') ? 'week' : 'month';
  const key = d => unit === 'day' ? d : unit === 'week' ? weekOf(d) : d.slice(0, 7);
  const buckets = [];
  for (let d = parseYmd(A); ymd(d) <= B; d = addDays(d, 1)) { const k = key(ymd(d)); if (buckets[buckets.length - 1]?.k !== k) buckets.push({ k, from: ymd(d), v:0 }); }
  for (const d of ev) if (d >= A && d <= B) { const b = buckets.find(x => x.k === key(d)); if (b) b.v++; }
  const goal = c.goal && c.goal.per === unit ? c.goal.n : null;
  const max = Math.max(1, goal || 0, ...buckets.map(b => b.v)), n = buckets.length, W = n * 10, H = 40;
  const chart = svg('svg', { class:'cbars', viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:'none', role:'img', 'aria-label':`${c.name} per ${unit}` });
  buckets.forEach((b, i) => {
    const h = b.v / max * (H - 2);
    chart.append(svg('rect', { x: i * 10 + 1.5, y: H - Math.max(h, b.v ? 1.5 : 0.6), width:7, height: Math.max(h, b.v ? 1.5 : 0.6), rx:1, style:`fill:${b.v ? col : 'var(--line)'}` },
      svg('title', { text:`${unit === 'month' ? fmtD(parseYmd(b.from), { month:'short', year:'numeric' }) : unit === 'week' ? 'Week of ' + fmtD(parseYmd(b.k)) : fmtD(parseYmd(b.k), { weekday:'short', month:'short', day:'numeric' })}: ${b.v}` })));
  });
  if (goal) chart.append(svg('line', { x1:0, x2:W, y1: H - goal / max * (H - 2), y2: H - goal / max * (H - 2), style:'stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3;opacity:.5', 'vector-effect':'non-scaling-stroke' }));
  const lbl = d => fmtD(parseYmd(d), unit === 'month' ? { month:'short' } : { month:'short', day:'numeric' });
  return el('div', { class:'cbar-wrap' }, chart,
    el('div', { class:'cbar-axis' }, el('span', { text: lbl(buckets[0].from) }), el('span', { text: unit === 'day' ? 'per day' : `per ${unit}${goal ? ' · dashed line = goal' : ''}` }), el('span', { text:'Today' })));
}

// ----- add / edit counter -----
function counterDialog(c){
  const ed = c ? JSON.parse(JSON.stringify(c)) : { id: newId(), name:'', targets:[], mode:'days', min:0, goal:null, base:null, pin:true };
  const name = el('input', { type:'text', id:'cName', maxlength:'60', autocomplete:'off', value: ed.name });
  const chosen = el('div', { class:'ctargets' }), q = el('input', { class:'search', type:'search', placeholder:'Add a task, group or project', autocomplete:'off', spellcheck:'false', 'aria-label':'Add a task, group or project' });
  const pick = el('div', { class:'pick', role:'listbox', 'aria-label':'Choices' });
  const drawChosen = () => chosen.replaceChildren(...(ed.targets.length ? ed.targets.map((t, i) => {
    const tg = targetOf(t), dot = el('span', { class:'dot' }); dot.style.background = tg.color;
    return el('span', { class:'chip' }, dot, el('span', { text: tg.name }),
      el('button', { type:'button', class:'chip-x', 'aria-label':`Remove ${tg.name}`, text:'×', onclick: () => { ed.targets.splice(i, 1); drawChosen(); } }));
  }) : [el('span', { class:'muted', text:'Nothing chosen yet.' })]));
  const drawPick = () => {
    const items = q.value.trim() ? planCandidates(q.value.trim()) : [];
    pick.classList.toggle('hidden', !items.length);
    pick.replaceChildren(...items.map(it => { const dot = el('span', { class:'dot' }); if (it.color) dot.style.background = it.color;
      return el('button', { class:'row', type:'button', onclick: () => { if (!ed.targets.some(t => sameRef(t, it.ref))) ed.targets.push(it.ref); q.value = ''; drawPick(); drawChosen(); q.focus(); } },
        dot, el('span', { class:'label' }, el('div', { class:'title', text:it.name }), el('div', { class:'meta', text:it.sub }))); }));
  };
  q.addEventListener('input', drawPick);
  const sel = (id, opts, val) => { const s = el('select', { id }); for (const [v, t] of opts) s.append(el('option', { value:v, text:t })); s.value = val; return s; };
  const mode = sel('cMode', [['days', 'Once per day'], ['sessions', 'Each session']], ed.mode);
  const min = el('input', { type:'number', id:'cMin', min:'0', max:'1440', step:'5', value: String(ed.min || 0) });
  const gk = sel('cGoalKind', [['', 'No goal'], ['min', 'At least'], ['max', 'At most']], ed.goal?.kind || '');
  const gn = el('input', { type:'number', id:'cGoalN', min:'1', max:'999', value: String(ed.goal?.n || 3), 'aria-label':'Goal number' });
  const gp = sel('cGoalPer', [['week', 'per week'], ['month', 'per month']], ed.goal?.per || 'week');
  const goalRow = el('div', { class:'times-row' }, el('div', { class:'field' }, el('label', { for:'cGoalKind', text:'Goal' }), gk),
    el('div', { class:'field' }, el('label', { for:'cGoalN', text:'How many' }), gn), el('div', { class:'field' }, el('label', { for:'cGoalPer', text:'Per' }), gp));
  const syncGoal = () => { gn.disabled = gp.disabled = !gk.value; };
  gk.addEventListener('change', syncGoal);
  const bn = el('input', { type:'number', id:'cBaseN', min:'0', max:'99999', value: ed.base ? String(ed.base.n) : '', placeholder:'None' });
  const bd = el('input', { type:'date', id:'cBaseD', value: ed.base?.through || ymd(new Date()), max: ymd(new Date()) });
  const pin = el('input', { type:'checkbox' }); pin.checked = !!ed.pin;
  const save = () => {
    ed.name = name.value.trim();
    if (!ed.name) { toast('Give the counter a name', true); name.focus(); return; }
    ed.mode = mode.value; ed.min = Math.max(0, Math.min(1440, Math.round(+min.value || 0)));
    ed.goal = gk.value ? { kind: gk.value, n: Math.max(1, Math.round(+gn.value || 1)), per: gp.value } : null;
    ed.base = bn.value !== '' && bd.value ? { n: Math.max(0, Math.round(+bn.value)), through: bd.value } : null;
    ed.pin = pin.checked;
    const i = counters.list.findIndex(x => x.id === ed.id);
    if (i >= 0) counters.list[i] = ed; else counters.list.push(ed);
    saveCounters(); dlg.close(); renderCounts(); renderList();
  };
  const dlg = openDialog(c ? `Edit ${c.name}` : 'New counter',
    el('div', { class:'field', style:'margin-top:0' }, el('label', { for:'cName', text:'Name' }), name),
    el('div', { class:'field' }, el('span', { text:'Counts time on' }), chosen, q, pick),
    el('div', { class:'times-row' },
      el('div', { class:'field' }, el('label', { for:'cMode', text:'Count' }), mode),
      el('div', { class:'field' }, el('label', { for:'cMin', text:'Min. minutes' }), min)),
    goalRow,
    el('div', { class:'times-row' },
      el('div', { class:'field' }, el('label', { for:'cBaseN', text:'Count so far this year' }), bn),
      el('div', { class:'field' }, el('label', { for:'cBaseD', text:'As of (including)' }), bd)),
    el('p', { class:'hint', style:'margin:0', text:'Starting count is optional: use it when earlier times were not tracked this way. Later instances are added to it.' }),
    el('label', { class:'check' }, pin, 'Show on the Timer tab'),
    el('div', { class:'btns', style:'margin-top:12px' },
      el('button', { class:'btn primary', type:'button', text:'Save', onclick: save }),
      el('button', { class:'btn', type:'button', text:'Cancel', onclick: () => dlg.close() }),
      c ? el('button', { class:'btn danger', type:'button', text:'Delete', onclick: () => {
        if (!confirm(`Delete the ${c.name} counter? Your Clockify entries are not affected.`)) return;
        counters.list = counters.list.filter(x => x.id !== c.id); saveCounters(); dlg.close(); renderCounts(); renderList(); } }) : null));
  drawChosen(); drawPick(); syncGoal(); if (!c) name.focus();
}

// ---------- boot ----------
indexCache(); renderAll();
importFromHash();
if (!apiKey) showSettings(true);
else if (!cache) connect();
else {
  sync('auto');
  if ((!cache.clients || Date.now() - cache.at > DAY) && Date.now() >= backoffUntil) refreshData(false).then(renderAll).catch(handleError);
}
})();
</script>
